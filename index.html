<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --espresso: #1A1714;
    --panel: #211D19;
    --panel-2: #2A2521;
    --cream: #F3EFE7;
    --cream-dim: #A79E90;
    --bronze: #C9A66B;
    --bronze-soft: #8C7550;
    --line: #3A342E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--espresso);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
  }
  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 64px 24px 90px;
  }

  .topbar {
    text-align: center;
    margin-bottom: 56px;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--bronze);
    margin-bottom: 14px;
  }
  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 44px;
    letter-spacing: 0.5px;
  }
  .wordmark .thin { font-weight: 400; font-style: italic; color: var(--cream-dim); }
  .rule {
    width: 40px;
    height: 1px;
    background: var(--bronze);
    margin: 22px auto 0;
  }

  .steps {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 54px;
  }
  .step-pill {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cream-dim);
    padding-bottom: 8px;
    border-bottom: 1px solid transparent;
    cursor: pointer;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'Inter', sans-serif;
  }
  .step-pill:hover { color: var(--bronze); }
  .step-pill.active { color: var(--bronze); border-color: var(--bronze); }
  .step-pill.done { color: var(--cream); border-color: var(--line); }

  .section { margin-bottom: 52px; }
  h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 22px;
    margin: 0 0 24px;
    color: var(--cream);
  }

  /* Muscle group chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--cream-dim);
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .chip:hover { border-color: var(--bronze-soft); color: var(--cream); }
  .chip.selected { border-color: var(--bronze); color: var(--bronze); background: rgba(201,166,107,0.08); }

  .exercise-list {
    margin-top: 22px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .exercise-card {
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .exercise-card .ex-name {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    margin-bottom: 6px;
  }
  .exercise-card .ex-desc {
    font-size: 12.5px;
    color: var(--cream-dim);
    line-height: 1.6;
  }

  .trainers {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .trainer-card {
    background: var(--espresso);
    padding: 26px 22px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .trainer-card:hover { background: var(--panel); }
  .trainer-card.selected { background: var(--panel-2); box-shadow: inset 0 2px 0 var(--bronze); }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--bronze-soft);
    color: var(--bronze);
    font-family: 'Fraunces', serif;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .trainer-name {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .trainer-spec {
    font-size: 12px;
    color: var(--cream-dim);
    letter-spacing: 0.3px;
  }

  .dates {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-btn {
    background: transparent;
    border: 1px solid var(--line);
    padding: 14px 18px;
    color: var(--cream);
    cursor: pointer;
    text-align: center;
    min-width: 64px;
  }
  .date-btn .d { font-size: 9px; color: var(--cream-dim); text-transform: uppercase; letter-spacing: 1px; }
  .date-btn .n { font-family: 'Fraunces', serif; font-size: 19px; margin-top: 4px; }
  .date-btn:hover { border-color: var(--bronze-soft); }
  .date-btn.selected { border-color: var(--bronze); background: rgba(201,166,107,0.06); }

  .slots {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 10px;
  }
  .slot-btn {
    background: transparent;
    border: 1px solid var(--line);
    padding: 11px;
    color: var(--cream);
    cursor: pointer;
    font-size: 13px;
    text-align: center;
  }
  .slot-btn:hover:not(.taken) { border-color: var(--bronze-soft); }
  .slot-btn.selected { border-color: var(--bronze); background: rgba(201,166,107,0.06); color: var(--bronze); }
  .slot-btn.taken {
    opacity: 0.3;
    cursor: not-allowed;
    text-decoration: line-through;
  }

  .form-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .form-row input {
    flex: 1;
    min-width: 220px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--cream);
    padding: 10px 2px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
  }
  .form-row input::placeholder { color: var(--cream-dim); }
  .form-row input:focus { border-color: var(--bronze); }

  .summary {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 22px 0;
    margin: 28px 0;
    font-size: 14px;
    color: var(--cream-dim);
    text-align: center;
  }
  .summary strong { color: var(--bronze); font-weight: 500; }

  .confirm-btn {
    display: block;
    margin: 0 auto;
    background: transparent;
    color: var(--bronze);
    border: 1px solid var(--bronze);
    padding: 16px 44px;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .confirm-btn:hover:not(:disabled) { background: var(--bronze); color: var(--espresso); }
  .confirm-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,8,6,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--bronze);
    padding: 44px 38px;
    max-width: 380px;
    text-align: center;
  }
  .modal .mark {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 30px;
    color: var(--bronze);
    margin-bottom: 18px;
  }
  .modal h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    margin: 0 0 14px;
  }
  .modal p {
    color: var(--cream-dim);
    font-size: 13px;
    line-height: 1.7;
    margin: 0 0 26px;
  }
  .modal button {
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--line);
    padding: 12px 28px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .modal button:hover { border-color: var(--bronze); color: var(--bronze); }
</style>

<div class="app">
  <div class="topbar">
    <div class="kicker">Personal Training</div>
    <div class="wordmark">VELVET <span class="thin">Strength</span></div>
    <div class="rule"></div>
  </div>

  <div class="steps">
    <div class="step-pill active" id="pill-0">Fokus</div>
    <div class="step-pill" id="pill-1">Trainer</div>
    <div class="step-pill" id="pill-2">Termin</div>
    <div class="step-pill" id="pill-3">Bestätigen</div>
  </div>

  <div class="section" id="section-fokus">
    <h2>Was ist dein Ziel?</h2>
    <div class="chips" id="muscles"></div>
  </div>

  <div class="section" id="section-trainer">
    <h2>Trainer wählen</h2>
    <div class="trainers" id="trainers"></div>
  </div>

  <div class="section" id="section-termin">
    <h2>Datum</h2>
    <div class="dates" id="dates"></div>
    <h2 style="margin-top:32px;">Uhrzeit</h2>
    <div class="slots" id="slots"></div>
  </div>

  <div class="section" id="section-bestaetigen">
    <h2>Deine Daten</h2>
    <div class="form-row">
      <input id="nameInput" type="text" placeholder="Name" />
      <input id="emailInput" type="email" placeholder="E-Mail" />
    </div>
  </div>

  <div class="summary" id="summary">Wähle dein Ziel, Trainer, Datum und Uhrzeit, um fortzufahren.</div>

  <button class="confirm-btn" id="confirmBtn" disabled>Termin anfragen</button>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mark">&#10003;</div>
    <h3>Termin angefragt</h3>
    <p id="modalText"></p>
    <button id="closeModal">Schließen</button>
  </div>
</div>

<script>
  const MUSCLES = ['Kraftaufbau', 'Beweglichkeit & Regeneration', 'Ausdauer', 'Ganzheitliche Fitness'];

  const TRAINERS = [
    { id: 't1', name: 'Nora K.', spec: 'Kraft & Hypertrophie', initials: 'NK', tags: ['Kraftaufbau'] },
    { id: 't2', name: 'Elias B.', spec: 'Functional Training', initials: 'EB', tags: ['Ganzheitliche Fitness'] },
    { id: 't3', name: 'Mia R.', spec: 'Mobility & Reha', initials: 'MR', tags: ['Beweglichkeit & Regeneration'] },
    { id: 't4', name: 'Tom S.', spec: 'HIIT & Ausdauer', initials: 'TS', tags: ['Ausdauer', 'Ganzheitliche Fitness'] }
  ];

  const today = new Date();
  const DATES = Array.from({ length: 6 }).map((_, i) => {
    const d = new Date(today);
    d.setDate(d.getDate() + i + 1);
    return d;
  });

  const ALL_SLOTS = ['08:00', '09:00', '10:00', '11:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'];

  let state = { muscles: [], trainer: null, date: null, slot: null };

  const pillTargets = {
    'pill-0': 'section-fokus',
    'pill-1': 'section-trainer',
    'pill-2': 'section-termin',
    'pill-3': 'section-bestaetigen'
  };
  Object.entries(pillTargets).forEach(([pillId, sectionId]) => {
    document.getElementById(pillId).addEventListener('click', () => {
      document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  // Muscle chips
  const musclesEl = document.getElementById('muscles');
  MUSCLES.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = m;
    chip.addEventListener('click', () => {
      if (state.muscles.includes(m)) {
        state.muscles = state.muscles.filter(x => x !== m);
        chip.classList.remove('selected');
      } else {
        state.muscles.push(m);
        chip.classList.add('selected');
      }
      renderTrainers();
      updateSummary();
    });
    musclesEl.appendChild(chip);
  });

  // Trainers
  const trainersEl = document.getElementById('trainers');
  function renderTrainers() {
    trainersEl.innerHTML = '';
    let list = TRAINERS;
    if (state.muscles.length > 0) {
      const matched = TRAINERS.filter(t => t.tags.some(tag => state.muscles.includes(tag)));
      list = matched.length > 0 ? matched : TRAINERS;
    }
    list.forEach(t => {
      const card = document.createElement('div');
      card.className = 'trainer-card' + (state.trainer && state.trainer.id === t.id ? ' selected' : '');
      card.innerHTML = `
        <div class="avatar">${t.initials}</div>
        <div class="trainer-name">${t.name}</div>
        <div class="trainer-spec">${t.spec}</div>
      `;
      card.addEventListener('click', () => {
        state.trainer = t;
        renderTrainers();
        updateSummary();
      });
      trainersEl.appendChild(card);
    });
  }
  renderTrainers();

  // Dates
  const datesEl = document.getElementById('dates');
  function dayLabel(d) { return d.toLocaleDateString('de-DE', { weekday: 'short' }); }
  DATES.forEach(d => {
    const btn = document.createElement('div');
    btn.className = 'date-btn';
    btn.innerHTML = `<div class="d">${dayLabel(d)}</div><div class="n">${d.getDate()}.${d.getMonth() + 1}.</div>`;
    btn.addEventListener('click', () => {
      state.date = d;
      document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      renderSlots();
      updateSummary();
    });
    datesEl.appendChild(btn);
  });

  const slotsEl = document.getElementById('slots');
  function renderSlots() {
    slotsEl.innerHTML = '';
    const seed = state.date ? state.date.getDate() : 0;
    ALL_SLOTS.forEach((s, i) => {
      const taken = (seed + i) % 4 === 0;
      const btn = document.createElement('div');
      btn.className = 'slot-btn' + (taken ? ' taken' : '');
      btn.textContent = s;
      if (!taken) {
        btn.addEventListener('click', () => {
          state.slot = s;
          document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          updateSummary();
        });
      }
      slotsEl.appendChild(btn);
    });
  }
  renderSlots();

  const summaryEl = document.getElementById('summary');
  const confirmBtn = document.getElementById('confirmBtn');

  function updateSummary() {
    document.getElementById('pill-0').classList.toggle('done', state.muscles.length > 0);
    document.getElementById('pill-1').classList.toggle('done', !!state.trainer);
    document.getElementById('pill-1').classList.toggle('active', state.muscles.length > 0 && !state.trainer);
    document.getElementById('pill-2').classList.toggle('done', !!(state.date && state.slot));
    document.getElementById('pill-2').classList.toggle('active', !!state.trainer && !(state.date && state.slot));
    document.getElementById('pill-3').classList.toggle('active', !!(state.trainer && state.date && state.slot));

    if (state.trainer && state.date && state.slot) {
      const dateStr = state.date.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
      summaryEl.innerHTML = `Termin mit <strong>${state.trainer.name}</strong> am <strong>${dateStr}</strong> um <strong>${state.slot} Uhr</strong>.`;
      confirmBtn.disabled = false;
    } else {
      summaryEl.textContent = 'Wähle dein Ziel, Trainer, Datum und Uhrzeit, um fortzufahren.';
      confirmBtn.disabled = true;
    }
  }

  const overlay = document.getElementById('overlay');
  const modalText = document.getElementById('modalText');

  confirmBtn.addEventListener('click', () => {
    const name = document.getElementById('nameInput').value.trim() || 'Gast';
    const dateStr = state.date.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
    modalText.textContent = `Hi ${name}, dein Termin mit ${state.trainer.name} am ${dateStr} um ${state.slot} Uhr wurde angefragt. Das Studio bestätigt dir das in Kürze per E-Mail. (Demo — es wird keine echte E-Mail versendet.)`;
    overlay.classList.add('open');
  });

  document.getElementById('closeModal').addEventListener('click', () => {
    overlay.classList.remove('open');
  });
</script>
